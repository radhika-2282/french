<section class="content-section">
      <h2>🤝 Présenter Quelqu’un (To introduce someone)</h2>
      <div class="presentation-card"
        style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; background: white; padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: 2px solid var(--accent-yellow);">
        <div style="flex: 1 1 300px; text-align: center;">
          <img src="images/mon_meilleur_ami.png" alt="2 boys best friends"
            style="width: 100%; max-width: 350px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); margin-bottom: 1rem;" />
          <h3 style="color: var(--primary-blue); font-size: 1.5rem;">Mon meilleur ami</h3>
        </div>
        <div style="flex: 1.5 1 400px; display: flex; flex-direction: column; gap: 0.5rem;">
          <div onclick="speak('Bonjour')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--accent-yellow)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">Bonjour,</span>
          </div>
          <div onclick="speak('Je vous présente mon meilleur ami.')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--primary-red)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--primary-red);">Je vous présente mon meilleur
              ami.</span>
          </div>
          <div onclick="speak('Il s’appelle Nick.', 'male')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--primary-blue)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">Il s’appelle Nick.</span>
          </div>
          <div onclick="speak('Il a dix ans.', 'male')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--accent-green)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">Il a 10 ans.</span>
          </div>
          <div onclick="speak('Il habite à Mumbai.', 'male')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--accent-yellow)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">Il habite à Mumbai.</span>
          </div>
          <div onclick="speak('Il parle hindi et anglais.', 'male')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--primary-red)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">Il parle hindi et
              anglais.</span>
          </div>
          <div onclick="speak('Il aime le cricket.', 'male')"
            style="cursor: pointer; padding: 12px 16px; border-radius: 12px; transition: background 0.2s; border-left: 4px solid transparent;"
            onmouseover="this.style.background='#f8fafc'; this.style.borderColor='var(--primary-blue)';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <span style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">Il aime le cricket.</span>
          </div>
        </div>
      </div>
    </section>
