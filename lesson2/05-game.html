                                </p>

                        🎮 Tell the time in French: quiz and flashcards

<script>
        // --- Shared Utilities ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- Numbers Listening Game Logic ---
        const game = {
            currentQuestion: 0,
            currentSet: 1,
            maxSets: 5,
            targetNumber: 0,
            canClick: true,
            attempts: 0
        };

        function initGame() {
            game.currentQuestion = 0;
            game.currentSet = 1;
            game.attempts = 0;
            game.canClick = true;
            showNumberScreen('game-play-screen');
            nextQuestion();
        }

        function handleNextStep() {
            if (game.currentSet < game.maxSets) {
                game.currentSet++;
                game.currentQuestion = 0;
                game.attempts = 0;
                showNumberScreen('game-play-screen');
                nextQuestion();
            } else {
                initGame();
            }
        }

        function showNumberScreen(id) {
            ['game-start-screen', 'game-play-screen', 'game-end-screen'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.style.display = (s === id) ? 'block' : 'none';
            });
        }

        // Fisher-Yates Shuffle for truly random options
        function shuffleOptions(array) {
            return shuffleArray([...array]);
        }

        function nextQuestion() {
            game.currentQuestion++;
            if (game.currentQuestion > 5) {
                finishGame();
                return;
            }

            game.canClick = true;
            document.getElementById('question-indicator').innerText = `Set ${game.currentSet} • Question ${game.currentQuestion} / 5`;

            game.targetNumber = Math.floor(Math.random() * 100) + 1;

            let options = [game.targetNumber];
            while (options.length < 3) {
                let rand = Math.floor(Math.random() * 100) + 1;
                if (!options.includes(rand)) options.push(rand);
            }

            options = shuffleOptions(options);

            const container = document.getElementById('options-container');
            container.innerHTML = "";
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.className = "number-card";
                btn.style.margin = "0";
                btn.style.padding = "2rem 1rem";
                btn.style.fontSize = "2rem";
                btn.style.fontWeight = "800";
                btn.innerHTML = num;
                btn.onclick = () => handleChoice(num, btn);
                container.appendChild(btn);
            });

            playCurrentNumber();
        }

        function playCurrentNumber() {
            speak(game.targetNumber.toString());
        }

        function handleChoice(num, btn) {
            if (!game.canClick || btn.disabled) return;
            game.attempts++;

            if (num === game.targetNumber) {
                game.canClick = false;
                btn.style.background = "#dcfce7";
                btn.style.borderColor = "var(--accent-green)";
                btn.style.color = "var(--accent-green)";
                btn.innerHTML = num + " ✅";
                setTimeout(() => nextQuestion(), 1200);
            } else {
                btn.style.background = "#fee2e2";
                btn.style.borderColor = "var(--primary-red)";
                btn.style.color = "var(--primary-red)";
                btn.innerHTML = num + " ❌";
                btn.disabled = true;
                btn.style.cursor = "default";
            }
        }

        function finishGame() {
            showNumberScreen('game-end-screen');

            let apFR = "", apEN = "", emo = "";
            if (game.attempts === 5) { apFR = "Bravo !"; apEN = "Well done"; emo = "👏👏✨"; }
            else if (game.attempts <= 8) { apFR = "Bien !"; apEN = "Good"; emo = "😊👍"; }
            else { apFR = "Essaie encore !"; apEN = "Try again"; emo = "🎯🔥"; }

            document.getElementById('final-appreciation').innerHTML = `
                <div style="font-size: 4.5rem; margin-bottom: 1rem;">${emo}</div>
                <div style="color: var(--primary-blue); font-size: 3rem;">${apFR}</div>
                <div style="font-size: 1.3rem; color: var(--text-muted); font-weight: 600; margin-top: 5px; font-style: italic;">(${apEN})</div>
            `;
            document.getElementById('game-result-text').innerHTML = `Attempts: <b>${game.attempts}</b><br>Set ${game.currentSet} Complete!`;
            setTimeout(() => speak(apFR), 500);

            const btn = document.getElementById('next-btn');
            if (game.currentSet < game.maxSets) {
                btn.innerText = "Next Set ➡️";
                btn.style.background = "var(--accent-green)";
            } else {
                btn.innerText = "Restart Game 🔄";
                btn.style.background = "var(--primary-blue)";
            }
        }

        // --- Time Listening Game Logic ---
        const timeData = [
            { fr: "Il est une heure", time: "1:00" },
            { fr: "Il est deux heures et demie", time: "2:30" },
            { fr: "Il est cinq heures et quart", time: "5:15" },
            { fr: "Il est midi", time: "12:00" },
            { fr: "Il est minuit", time: "00:00" },
            { fr: "Il est six heures moins le quart", time: "5:45" },
            { fr: "Il est sept heures moins dix", time: "6:50" },
            { fr: "Il est huit heures vingt", time: "8:20" },
            { fr: "Il est dix heures dix", time: "10:10" },
            { fr: "Il est trois heures cinq", time: "3:05" },
            { fr: "Il est quatre heures quarante-cinq", time: "4:45" },
            { fr: "Il est neuf heures quinze", time: "9:15" },
            { fr: "Il est onze heures vingt-cinq", time: "11:25" },
            { fr: "Il est deux heures moins le quart", time: "1:45" },
            { fr: "Il est cinq heures trente-cinq", time: "5:35" }
        ];
        /*  speak("Il est une heure")
            speak("Il est deux heures et demie")
            speak("Il est cinq heures et quart")
            speak("Il est midi")
            speak("Il est minuit")
            speak("Il est six heures moins le quart")
            speak("Il est sept heures moins dix")
            speak("Il est huit heures vingt")
            speak("Il est dix heures dix")
            speak("Il est trois heures cinq")
            speak("Il est quatre heures quarante-cinq")
            speak("Il est neuf heures quinze")
            speak("Il est onze heures vingt-cinq")
            speak("Il est deux heures moins le quart")
            speak("Il est cinq heures trente-cinq")
            speak("Bien !")
        */


        const tGame = {
            currentQuestion: 0,
            currentSet: 1,
            maxSets: 5,
            target: null,
            canClick: true,
            attempts: 0
        };

        function initTimeGame() {
            tGame.currentQuestion = 0;
            tGame.currentSet = 1;
            tGame.attempts = 0;
            tGame.canClick = true;
            showTimeScreen('time-game-play-screen');
            nextTimeQuestion();
        }

        function handleTimeNextStep() {
            if (tGame.currentSet < tGame.maxSets) {
                tGame.currentSet++;
                tGame.currentQuestion = 0;
                tGame.attempts = 0;
                showTimeScreen('time-game-play-screen');
                nextTimeQuestion();
            } else {
                initTimeGame();
            }
        }

        function showTimeScreen(id) {
            ['time-game-start-screen', 'time-game-play-screen', 'time-game-end-screen'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.style.display = (s === id) ? 'block' : 'none';
            });
        }

        function nextTimeQuestion() {
            tGame.currentQuestion++;
            if (tGame.currentQuestion > 5) {
                finishTimeGame();
                return;
            }

            tGame.canClick = true;
            document.getElementById('time-question-indicator').innerText = `Set ${tGame.currentSet} • Question ${tGame.currentQuestion} / 5`;

            const targetIdx = Math.floor(Math.random() * timeData.length);
            tGame.target = timeData[targetIdx];

            let options = [tGame.target];
            while (options.length < 3) {
                let rand = timeData[Math.floor(Math.random() * timeData.length)];
                if (!options.some(o => o.time === rand.time)) options.push(rand);
            }
            options = shuffleArray(options);

            const container = document.getElementById('time-options-container');
            container.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "center-card";
                btn.style.margin = "0";
                btn.style.padding = "2rem 1rem";
                btn.style.fontSize = "2rem";
                btn.style.fontWeight = "800";
                btn.style.fontFamily = "'Courier New', Courier, monospace";
                btn.innerHTML = (opt.time === "00:00") ? "00:00" : opt.time;
                btn.onclick = () => handleTimeChoice(opt, btn);
                container.appendChild(btn);
            });

            playCurrentTime();
        }

        function playCurrentTime() {
            speak(tGame.target.fr);
        }

        function handleTimeChoice(opt, btn) {
            if (!tGame.canClick || btn.disabled) return;
            tGame.attempts++;

            if (opt.time === tGame.target.time) {
                tGame.canClick = false;
                btn.style.background = "#dcfce7";
                btn.style.borderColor = "var(--accent-green)";
                btn.style.color = "var(--accent-green)";
                btn.innerHTML = btn.innerHTML.replace(" ❌", "") + " ✅";
                setTimeout(() => nextTimeQuestion(), 1200);
            } else {
                btn.style.background = "#fee2e2";
                btn.style.borderColor = "var(--primary-red)";
                btn.style.color = "var(--primary-red)";
                if (!btn.innerHTML.includes("❌")) btn.innerHTML += " ❌";
                btn.disabled = true;
                btn.style.cursor = "default";
            }
        }

        function finishTimeGame() {
            showTimeScreen('time-game-end-screen');

            let apFR = "", apEN = "", emo = "";
            if (tGame.attempts === 5) { apFR = "Bravo !"; apEN = "Well done"; emo = "👏👏✨"; }
            else if (tGame.attempts <= 8) { apFR = "Bien !"; apEN = "Good"; emo = "😊👍"; }
            else { apFR = "Essaie encore !"; apEN = "Try again"; emo = "🎯🔥"; }

            document.getElementById('time-final-appreciation').innerHTML = `
                <div style="font-size: 4.5rem; margin-bottom: 1rem;">${emo}</div>
                <div style="color: var(--primary-red); font-size: 3rem;">${apFR}</div>
                <div style="font-size: 1.3rem; color: var(--text-muted); font-weight: 600; margin-top: 5px; font-style: italic;">(${apEN})</div>
            `;
            document.getElementById('time-game-result-text').innerHTML = `Attempts: <b>${tGame.attempts}</b><br>Set ${tGame.currentSet} Complete!`;
            setTimeout(() => speak(apFR), 500);

            const btn = document.getElementById('time-next-btn');
            if (tGame.currentSet < tGame.maxSets) {
                btn.innerText = "Next Set ➡️";
                btn.style.background = "var(--accent-green)";
            } else {
                btn.innerText = "Restart Game 🔄";
                btn.style.background = "var(--primary-red)";
            }
        }
    </script>
